name: Build OpenCode image

# Запуск только вручную: вкладка Actions -> "Build OpenCode image" -> Run workflow
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег образа в GHCR (например: latest, 2.2.6, test)"
        required: false
        default: latest
      platforms:
        description: "Платформы через запятую (linux/amd64 или linux/amd64,linux/arm64)"
        required: false
        default: linux/amd64
      push:
        description: "Публиковать образ в GHCR (снимите галочку, чтобы только собрать)"
        type: boolean
        default: true

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (только для мультиарх-сборки)
        if: contains(inputs.platforms, ',')
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: inputs.push
        run: |
          {
            echo "## Образ собран"
            echo '```'
            echo "docker pull ${{ env.REGISTRY }}/${{ github.repository }}:${{ inputs.tag }}"
            echo '```'
            echo "Платформы: \`${{ inputs.platforms }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
